<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yorha — Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #0d0d0f;
    --card: #17171b;
    --border: #2a2a2f;
    --gold: #c9a24b;
    --text: #f0f0f0;
    --muted: #9a9aa2;
    --green: #4caf6a;
    --red: #e05555;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
  }
  h1 { font-family: 'Playfair Display', serif; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 32px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
  }
  .card .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .card .value { font-size: 26px; font-weight: 700; }
  .card .value.gold { color: var(--gold); }
  .card .value.green { color: var(--green); }
  .card .value.red { color: var(--red); }
  .section-title { font-size: 15px; color: var(--muted); margin: 32px 0 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .error { color: var(--red); padding: 20px; }
  .loading { color: var(--muted); padding: 20px; }

  .payout-list { display: flex; flex-direction: column; gap: 10px; }
  .payout-row {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; display: flex;
    justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .payout-row .who { font-weight: 600; }
  .payout-row .details { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .payout-row .amount { font-size: 18px; font-weight: 700; color: var(--gold); }
  .payout-actions { display: flex; gap: 8px; }
  .btn { border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .btn-paid { background: var(--green); color: #06210f; }
  .btn-failed { background: var(--red); color: #2a0a0a; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty-note { color: var(--muted); padding: 16px; font-size: 14px; }

  .token-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 24px; display: flex; gap: 10px; flex-wrap: wrap;
  }
  .token-box input {
    flex: 1; min-width: 200px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  .token-box button {
    background: var(--gold); color: #2a2100; border: none; border-radius: 8px;
    padding: 10px 18px; font-weight: 600; cursor: pointer;
  }
  .token-box p { width: 100%; }

  .users-toggle-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--gold);
    border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; margin: 32px 0 12px; display: inline-flex; align-items: center; gap: 8px;
  }
  .users-toggle-btn:hover { border-color: var(--gold); }
  #users-panel { display: none; }
  #users-search {
    width: 100%; max-width: 320px; padding: 10px 14px; margin-bottom: 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text);
  }
  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; }
  #users-table { width: 100%; min-width: 480px; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  #users-table th, #users-table td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; white-space: nowrap; }
  #users-table th { color: var(--gold); }

  @media (max-width: 600px) {
    body { padding: 24px 14px; }
    h1 { font-size: 22px; }
    .grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .card { padding: 14px; }
    .card .value { font-size: 20px; }
    .section-title { font-size: 13px; margin: 24px 0 10px; }
    .payout-row { flex-direction: column; align-items: stretch; padding: 14px; }
    .payout-row .amount { order: -1; }
    .payout-actions { width: 100%; }
    .payout-actions .btn { flex: 1; padding: 10px; }
    .users-toggle-btn { width: 100%; justify-content: center; }
    #users-search { max-width: none; }
  }
</style>
</head>
<body>

<h1>Yorha Admin</h1>
<p class="sub">Platform overview</p>

<div id="token-box" class="token-box" style="display:none;">
  <input id="token-input" type="password" placeholder="Paste admin token (copy from desktop's localStorage → yorha_token)">
  <button onclick="useManualToken()">Use this token</button>
  <p id="token-box-note" style="color:var(--muted);font-size:12px;margin:8px 0 0;"></p>
</div>

<div id="content" class="loading">Loading dashboard…</div>

<div class="section-title">Pending Payout Requests</div>
<div id="payouts" class="loading">Loading payouts…</div>

<button class="users-toggle-btn" onclick="toggleUsers()">👥 Users <span id="users-count-badge"></span></button>
<div id="users-panel">
  <input id="users-search" type="text" placeholder="Search by name or email..." oninput="filterUsers()">
  <div class="table-scroll">
    <table id="users-table">
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Joined</th></tr></thead>
      <tbody id="users-rows"></tbody>
    </table>
  </div>
</div>

<script>
  // ── Adjust this if your setup differs
  const API_BASE = 'https://yorha-backend.onrender.com/api';

  // TOKEN is mutable now — localStorage is per-device, so a token saved
  // on desktop never shows up here on mobile automatically. If none is
  // found (or the stored one is rejected), showTokenBox() lets you paste
  // one in manually and it gets saved to *this* device's localStorage,
  // matching how Auth.setSession() stores it in the main app.
  let TOKEN = localStorage.getItem('yorha_token');

  const naira = (n) => '₦' + Number(n || 0).toLocaleString();

  function showTokenBox(message) {
    const box = document.getElementById('token-box');
    box.style.display = 'flex';
    document.getElementById('token-box-note').textContent =
      message || 'On desktop: open devtools → Application → Local Storage → copy the "yorha_token" value, then paste it here.';
  }

  function useManualToken() {
    const val = document.getElementById('token-input').value.trim();
    if (!val) return;
    TOKEN = val;
    localStorage.setItem('yorha_token', val); // persists for future visits on this device
    document.getElementById('token-box').style.display = 'none';
    loadDashboard();
    loadPayouts();
  }

  async function loadDashboard() {
    const el = document.getElementById('content');
    if (!TOKEN) {
      el.innerHTML = '<p class="error">No auth token found on this device.</p>';
      showTokenBox();
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/admin/dashboard`, {
        headers: { Authorization: `Bearer ${TOKEN}` },
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
          showTokenBox('Token rejected (invalid or expired). Paste a fresh one from a device where you\'re currently logged in as admin.');
        }
        throw new Error(data.error || 'Failed to load dashboard');
      }

      el.innerHTML = `
        <div class="section-title">Users</div>
        <div class="grid">
          <div class="card"><div class="label">Authors</div><div class="value gold">${data.authors}</div></div>
          <div class="card"><div class="label">Readers</div><div class="value gold">${data.readers}</div></div>
        </div>

        <div class="section-title">Revenue</div>
        <div class="grid">
          <div class="card"><div class="label">Total Revenue</div><div class="value green">${naira(data.revenue.total)}</div></div>
          <div class="card"><div class="label">Platform Fee (10%)</div><div class="value">${naira(data.revenue.platformFee)}</div></div>
          <div class="card"><div class="label">Author Earnings (90%)</div><div class="value">${naira(data.revenue.authorEarnings)}</div></div>
          <div class="card"><div class="label">Transaction Volume</div><div class="value">${data.revenue.transactionVolume}</div></div>
        </div>

        <div class="section-title">Payouts</div>
        <div class="grid">
          <div class="card"><div class="label">Paid Out</div><div class="value green">${naira(data.payouts.paidOut)}</div><div class="label">${data.payouts.paidOutCount} payouts</div></div>
          <div class="card"><div class="label">Pending Requests</div><div class="value">${naira(data.payouts.pending)}</div><div class="label">${data.payouts.pendingCount} requests</div></div>
          <div class="card"><div class="label">Failed / Rejected</div><div class="value red">${data.payouts.failedCount}</div></div>
        </div>

        <div class="section-title">Author Balances</div>
        <div class="grid">
          <div class="card"><div class="label">Total Pending Author Balance</div><div class="value gold">${naira(data.pendingAuthorBalance)}</div></div>
        </div>
      `;
    } catch (err) {
      el.innerHTML = `<p class="error">${err.message}</p>`;
    }
  }

  // ── Pending payouts ──────────────────────────────────────
  async function apiCall(path, options = {}) {
    const res = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${TOKEN}`, ...(options.headers || {}) },
    });
    const data = await res.json();
    if (!res.ok) {
      const err = new Error(data.error || 'Request failed');
      err.status = res.status;
      throw err;
    }
    return data;
  }

  async function loadPayouts() {
    const el = document.getElementById('payouts');
    try {
      const { payouts } = await apiCall('/payouts/admin/all?status=pending');
      renderPayouts(payouts);
    } catch (err) {
      if (err.status === 401 || err.status === 403) showTokenBox('Token rejected (invalid or expired).');
      el.innerHTML = `<p class="error">${err.message}</p>`;
    }
  }

  function renderPayouts(payouts) {
    const el = document.getElementById('payouts');
    if (!payouts.length) {
      el.innerHTML = '<p class="empty-note">No pending payout requests.</p>';
      return;
    }
    el.innerHTML = `<div class="payout-list">${payouts.map(p => `
      <div class="payout-row" id="payout-${p._id}">
        <div>
          <div class="who">${p.author?.name || 'Unknown author'} <span style="color:var(--muted);font-weight:400">(${p.author?.email || ''})</span></div>
          <div class="details">${p.bankName} · ${p.accountNumber} · ${p.accountName}</div>
        </div>
        <div class="amount">${naira(p.amount)}</div>
        <div class="payout-actions">
          <button class="btn btn-paid" onclick="markPayout('${p._id}', 'paid')">Mark Paid</button>
          <button class="btn btn-failed" onclick="markPayout('${p._id}', 'failed')">Mark Failed</button>
        </div>
      </div>
    `).join('')}</div>`;
  }

  async function markPayout(id, outcome) {
    const row = document.getElementById(`payout-${id}`);
    const buttons = row.querySelectorAll('button');
    buttons.forEach(b => b.disabled = true);

    try {
      if (outcome === 'paid') {
        const note = prompt('Optional note (e.g. "Sent via GTBank, ref #12345"):') || '';
        await apiCall(`/payouts/admin/${id}/mark-paid`, { method: 'POST', body: JSON.stringify({ note }) });
      } else {
        const reason = prompt('Reason for failure (refunds balance to author):') || '';
        await apiCall(`/payouts/admin/${id}/mark-failed`, { method: 'POST', body: JSON.stringify({ reason }) });
      }
      row.remove();
      loadDashboard(); // refresh stats since payout totals changed
    } catch (err) {
      alert(err.message);
      buttons.forEach(b => b.disabled = false);
    }
  }

  // ── Users panel ──────────────────────────────────────────
  let allUsers = [];
  let usersLoaded = false;

  async function toggleUsers() {
    const panel = document.getElementById('users-panel');
    if (panel.style.display === 'block') {
      panel.style.display = 'none';
      return;
    }
    panel.style.display = 'block';
    if (!usersLoaded) await loadUsers();
  }

  async function loadUsers() {
    try {
      const data = await apiCall('/admin/users-overview');
      allUsers = data.users;
      usersLoaded = true;
      document.getElementById('users-count-badge').textContent = `(${data.total})`;
      renderUsers(allUsers);
    } catch (err) {
      if (err.status === 401 || err.status === 403) showTokenBox('Token rejected (invalid or expired).');
      document.getElementById('users-rows').innerHTML = `<tr><td colspan="4" class="error">${err.message}</td></tr>`;
    }
  }

  function renderUsers(list) {
    document.getElementById('users-rows').innerHTML = list.map((u, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${u.name || '—'}</td>
        <td>${u.email}</td>
        <td>${new Date(u.joined).toLocaleDateString()}</td>
      </tr>`).join('');
  }

  function filterUsers() {
    const q = document.getElementById('users-search').value.toLowerCase();
    renderUsers(allUsers.filter(u =>
      (u.name || '').toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
    ));
  }

  loadDashboard();
  loadPayouts();
</script>

</body>
</html>
